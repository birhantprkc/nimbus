packages:
  - "packages/*"
  - "apps/*"
  - "examples/*"
  - "!**/template/**"
  - "!**/dist/**"
  - "!**/node_modules/**"
  # Gitignored local sandboxes (see .gitignore). They're scaffolded fresh
  # via `pnpm local` / `pnpm create @cloudflare/nimbus-docs` and aren't part of the
  # framework's lockfile. Excluding them here keeps `pnpm install` from
  # injecting their importers into pnpm-lock.yaml.
  - "!examples/local"
  # api-lab — committed source of truth for the API-reference layer, but kept
  # self-contained (own lockfile, `link:` to the local framework) so it can be
  # extracted to its own repo later. Installed with `pnpm install
  # --ignore-workspace`; excluded here so it stays out of the root lockfile and
  # `pnpm -r` runs.
  - "!apps/api-lab"
